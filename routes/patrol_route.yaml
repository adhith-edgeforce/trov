# Sample Patrol Route
# This route tells the robot which nodes to visit in order

route_id: "patrol_route_1"
route_name: "Basic Warehouse Patrol"
graph_id: "warehouse_patrol"  # Must match the graph file

# Sequence of waypoint IDs to visit
waypoints:
  - "entrance"
  - "station_a"
  - "loading_dock"
  - "station_b"
  - "entrance"  # Return to start

# Route behavior settings
loop: true  # Repeat the route indefinitely
