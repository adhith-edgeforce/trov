amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan

    # ── Motion model noise ────────────────────────────────────────────────
    # How much uncertainty to add per unit motion (translation/rotation)
    # Keep low — ICP odometry is reasonably accurate
    alpha1: 0.1    # was 0.2 — less rotational noise from rotation
    alpha2: 0.1    # was 0.2 — less rotational noise from translation  
    alpha3: 0.1    # was 0.2 — less translational noise from translation
    alpha4: 0.1    # was 0.2 — less translational noise from rotation


    # ── Update thresholds ─────────────────────────────────────────────────
    # Only run particle filter update after this much motion.
    # Increasing prevents AMCL from updating when people occlude the scan
    # while the robot is stationary/slow on the return trip.
    update_min_d: 0.25          # was 0.25 — only update after 0.5m translation
    update_min_a: 0.2          # was 0.2  — only update after 0.5rad rotation

    # ── Particle filter ───────────────────────────────────────────────────
    min_particles: 1000  #500
    max_particles: 8000  #5000      # was 2000 — more particles = more robust
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 3       # was 1 — resample every 3 updates, not every 1
                               # prevents filter from snapping to wrong hypothesis

    # ── Recovery (disabled) ───────────────────────────────────────────────
    # Keep both at 0 — random particle injection causes position jumps
    # when scan is temporarily occluded by people
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # ── Laser model ───────────────────────────────────────────────────────
    laser_model_type: "likelihood_field"
    laser_max_range: 100.0
    laser_min_range: -1.0
    max_beams: 60

    # Beam skip — CRITICAL FIX
    # When enabled, AMCL ignores laser beams that don't match the map.
    # This prevents people walking through the scan from corrupting
    # the particle filter during the return trip.
    do_beamskip: true          # was false — ENABLE
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # Sensor model weights
    # Increasing z_hit and decreasing z_rand means AMCL trusts
    # map-matching beams more and random hits less.
    # This makes it harder for people-occluded scans to pull the filter.
    z_hit: 0.7                 # was 0.5
    z_rand: 0.3                # was 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0

    # ── TF / timing ───────────────────────────────────────────────────────
    tf_broadcast: true
    transform_tolerance: 1.0
    save_pose_rate: 0.5

    # ── Initial pose ──────────────────────────────────────────────────────
    set_initial_pose: False
    initial_pose_x: -3.554
    initial_pose_y: 3.642
    initial_pose_a: -1.414