bt_navigator:
  ros__parameters:
    use_sim_time: False
    enable_stamped_cmd_vel: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom #odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 60
    wait_for_service_timeout: 1200
    action_server_result_timeout: 900.0
    # default_nav_to_pose_bt_xml: "/data/trov_ws/src/trov/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    # default_nav_through_poses_bt_xml: "/data/trov_ws/src/trov/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    default_nav_to_pose_bt_xml: "/data/trov_ws/src/trov/behavior_trees/navigate_to_pose_no_clear.xml"
    default_nav_through_poses_bt_xml: "/data/trov_ws/src/trov/behavior_trees/navigate_through_poses_no_clear.xml"
    # default_nav_to_pose_bt_xml: "/data/trov_ws/src/trov/behavior_trees/pause_on_obstacle.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3 #0.1
    transform_tolerance: 1.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 999.0
    
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0 
      yaw_goal_tolerance: 3.14 #0.25 #3.14
    
    FollowPath: 
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 2.0 # not being used when use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 1.6
      max_lookahead_dist: 5.0
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 1.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.5
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      interpolate_curvature_after_goal: true
      curvature_lookahead_dist: 1.4
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 1.5
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.4
      max_angular_accel: 4.0
      max_robot_pose_search_dist: 10.0
