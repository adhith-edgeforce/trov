### icp_odometry.yaml
### Config for rtabmap_odom::icp_odometry node
### Robot: TROV (no wheel encoders, skid-steer, 16-beam 3D LiDAR + IMU)
###
### Data flow:
###   /points (PointCloud2, 15Hz)  ──► icp_odometry ──► /odom
###   /imu/data (100Hz)            ──────────────────────────►  (used for motion guess)

icp_odometry:
  ros__parameters:
    use_sim_time: False

    # ── Frame IDs ────────────────────────────────────────────────────────
    frame_id: base_link          # robot base frame — must match your URDF base link name
    odom_frame_id: odom          # output odometry frame — nav2 expects "odom"
    publish_tf: true             # publishes odom → base_link TF
                                 # set false only if an EKF node publishes TF instead

    # ── Input topic wiring ───────────────────────────────────────────────
    # icp_odometry internally subscribes to /scan_cloud for PointCloud2
    # your launch file should remap /points → /scan_cloud
    subscribe_scan_cloud: true   # true = accept PointCloud2 input
    subscribe_scan: false        # false = not using 2D laser scan

    # ── IMU settings ─────────────────────────────────────────────────────
    # IMU provides a motion guess between scans so ICP starts closer
    # to the true solution — dramatically reduces iterations needed
    wait_imu_to_init: true       # wait for first IMU message before starting
                                 # prevents a bad initial odometry estimate
                                 # set false only if you have no IMU
    guess_frame_id: ""           # frame of the IMU guess — leave empty to use
                                 # rtabmap's internal IMU handling

    # ── Point cloud filtering ─────────────────────────────────────────────
    scan_range_min: 1.5          # ignore returns closer than this (metres)
                                 # filters out the robot's own body
    scan_range_max: 30.0         # ignore returns beyond this (metres)
                                 # matches your lidar's max reliable range
    scan_voxel_size: 0.4         # voxel grid downsampling resolution (metres)
                                 # larger = fewer points = faster ICP
                                 # 0.4 is a good balance for 16-beam lidar
                                 # too small (0.05) = too many points, too slow
                                 # too large (>0.5) = loss of detail, poor matching
    scan_normal_k: 10            # number of neighbours used to estimate surface normals
                                 # used by point-to-plane ICP
                                 # higher = smoother normals but more CPU
                                 # 10 is a reasonable value for sparse 16-beam clouds
    scan_cloud_max_points: 0     # hard cap on input cloud size — 0 means no limit
                                 # set e.g. 5000 if you want to cap compute

    # ── ICP algorithm parameters ──────────────────────────────────────────
    # IMPORTANT: All Icp/, Odom/, OdomF2M/, Reg/ parameters must be
    # passed as STRINGS — this is how rtabmap reads its internal parameters

    Icp/Strategy: "1"            # ICP implementation to use
                                 # 0 = libpointmatcher (more features, slower)
                                 # 1 = point-to-plane (faster, good for structured envs)

    Icp/Iterations: "20"         # max ICP iterations per scan pair
                                 # reduced from 30 — IMU guess means fewer needed
                                 # increase if odometry drifts at high speed

    Icp/MaxCorrespondenceDistance: "1.0"
                                 # max distance (metres) between matched point pairs
                                 # points further apart than this are not matched
                                 # too large = wrong matches, too small = no matches
                                 # 1.0m is appropriate for warehouse/indoor environments

    Icp/VoxelSize: "0.4"         # voxel size used INSIDE ICP algorithm
                                 # must match scan_voxel_size above
                                 # keeps the internal map and scan at same resolution

    Icp/PointToPlane: "true"     # use point-to-plane error metric instead of point-to-point
                                 # more accurate on flat surfaces (floors, walls)
                                 # requires surface normals (scan_normal_k above)

    Icp/PointToPlaneK: "10"      # neighbours used to compute plane normals inside ICP
                                 # should match scan_normal_k

    Icp/Epsilon: "0.001"         # convergence threshold — ICP stops when
                                 # transform change between iterations is below this
                                 # smaller = more precise but more iterations

    Icp/CorrespondenceRatio: "0.3"
                                 # minimum fraction of points that must find a match
                                 # for the scan to be accepted (0.0 to 1.0)
                                 # 0.3 = at least 30% of points matched
                                 # too high = frequent rejection in sparse environments

    Icp/OutlierRatio: "0.7"      # fraction of worst correspondences to discard
                                 # as outliers before computing the transform
                                 # was 0.9 (too aggressive — discarding 90% of points)
                                 # 0.7 = discard worst 70%, keep best 30%
                                 # lower value = more points used = more stable but
                                 # more sensitive to noise

    Icp/MaxRotation: "0.8"       # reject scan match if estimated rotation exceeds
                                 # this value in radians (~46 degrees)
                                 # protects against wild ICP failures

    Icp/MaxTranslation: "0.8"    # reject scan match if estimated translation exceeds
                                 # this in metres between consecutive scans
                                 # set based on your robot's max speed × scan period

    Icp/Force4DoF: "false"       # constrain ICP to 4DoF (x, y, z, yaw only)
                                 # false = full 6DoF matching
                                 # set true only for flat-floor robots with no ramps

    Odom/Strategy: "0"           # odometry estimation strategy
                                 # 0 = Frame-to-Map (F2M) — matches each scan against
                                 #     an accumulated local map — more stable, recommended
                                 # 1 = Frame-to-Frame — matches consecutive scans only
                                 #     faster but drifts more

    Odom/GuessMotion: "true"     # use IMU data to predict motion between scans
                                 # gives ICP a better starting point = fewer iterations
                                 # set false if you have no IMU

    Odom/GuessSmoothingDelay: "0.1"
                                 # seconds of IMU data to smooth for motion guess
                                 # helps filter IMU noise before using as ICP seed

    Odom/KeyFrameThr: "0.4"      # overlap threshold to trigger a new keyframe
                                 # higher = keyframes created less often = less compute
                                 # was 0.3, increased slightly to reduce CPU load

    Odom/ScanKeyFrameThr: "0.9"  # secondary keyframe threshold based on scan overlap
                                 # 0.9 = only create keyframe when overlap drops below 90%
                                 # keeps the local map fresh without over-triggering

    Odom/FillInfoData: "false"   # publish detailed debug info in odometry message
                                 # set true only when debugging — adds CPU overhead

    OdomF2M/ScanMaxSize: "5000"  # max number of points in the accumulated local map
                                 # was 20000 — too large, expensive to match against
                                 # 5000 is sufficient for 16-beam lidar at 0.4m voxels
                                 # increase if you see drift in large open spaces

    OdomF2M/ScanSubtractRadius: "0.5"
                                 # radius (metres) used to remove redundant points
                                 # when adding new scan to the local map
                                 # prevents the map from getting too dense
                                 # slightly increased from 0.3 to keep map leaner

    Reg/Force3DoF: "false"       # constrain registration to 3DoF (x, y, yaw only)
                                 # false = full 6DoF — correct for 3D lidar
                                 # set true only for pure 2D navigation with 2D lidar

    # ── Timing ───────────────────────────────────────────────────────────
    wait_for_transform: 1.0      # seconds to wait for a TF transform to become available
                                 # 1.0s is generous — reduce to 0.2 if TF is reliable
    expected_update_rate: 0.0    # expected input scan rate in Hz — 0 = no enforcement
                                 # set to your lidar Hz (e.g. 15.0) to get warnings
                                 # when scans are late
    publish_null_when_lost: true # publish a zero-velocity odometry message if ICP fails
                                 # prevents nav2 from using a stale pose
                                 # keeps the TF tree connected even during ICP failures