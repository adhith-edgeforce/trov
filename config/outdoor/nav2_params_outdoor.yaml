bt_navigator:
  ros__parameters:
    use_sim_time: False
    enable_stamped_cmd_vel: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 20
    default_server_timeout: 120
    wait_for_service_timeout: 1800
    action_server_result_timeout: 900.0
    default_nav_to_pose_bt_xml: "/data/trov_ws/src/trov/behavior_trees/navigate_to_pose_no_clear.xml"
    default_nav_through_poses_bt_xml: "/data/trov_ws/src/trov/behavior_trees/navigate_through_poses_no_clear.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 2.0
    transform_tolerance: 1.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 999.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.7
      yaw_goal_tolerance: 3.14

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6
      lookahead_dist: 2.0
      min_lookahead_dist: 1.6
      max_lookahead_dist: 5.0
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 1.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.5
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      interpolate_curvature_after_goal: true
      curvature_lookahead_dist: 1.4
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 1.5
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.4
      max_angular_accel: 4.0
      max_robot_pose_search_dist: 10.0
      min_distance_to_obstacle: 2.5

local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[1.0, 0.7], [1.0, -0.7], [-0.7, -0.7], [-0.7, 0.7]]"
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      transform_tolerance: 1.0
      width: 150
      height: 150
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 1.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: pointcloud semantic_pointcloud semantic_free   # ADD semantic_pointcloud
        pointcloud:                                           # UNCHANGED
          topic: /points_raw
          sensor_frame: lidar_link
          max_obstacle_height: 2.0
          min_obstacle_height: 0.22
          expected_update_rate: 5.0
          clearing: True
          marking: true
          data_type: "PointCloud2"
          obstacle_max_range: 30.0
          obstacle_min_range: 1.0
          raytrace_max_range: 29.0
          raytrace_min_range: 0.1
        semantic_pointcloud:                                  # ADD this block
          topic: /semantic_obstacle_points
          sensor_frame: camera_link
          max_obstacle_height: 2.5
          min_obstacle_height: 0.1
          expected_update_rate: 0.0
          clearing: False
          marking: true
          data_type: "PointCloud2"
          obstacle_max_range: 8.0
          obstacle_min_range: 0.4
          raytrace_max_range: 8.0
          raytrace_min_range: 0.4

        semantic_free:                           # NEW
          topic: /semantic_free_points
          sensor_frame: camera_link
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
          expected_update_rate: 0.0
          clearing: True                         # ← this is the key difference
          marking: False                         # never marks, only clears
          data_type: "PointCloud2"
          obstacle_max_range: 8.0
          obstacle_min_range: 0.4
          raytrace_max_range: 8.0
          raytrace_min_range: 0.4
          
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      transform_tolerance: 1.0
      rolling_window: true
      width: 300
      height: 300
      resolution: 0.05
      footprint: "[[1.0, 0.7], [1.0, -0.7], [-0.7, -0.7], [-0.7, 0.7]]"
      track_unknown_space: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: pointcloud
        pointcloud:
          topic: /points_raw
          sensor_frame: lidar_link
          expected_update_rate: 5.0
          clearing: True
          marking: true
          data_type: "PointCloud2"
          obstacle_max_range: 30.0
          obstacle_min_range: 1.0
          raytrace_max_range: 29.0
          raytrace_min_range: 0.1
          max_obstacle_height: 2.0
          min_obstacle_height: 0.22
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 20.0
    service_introspection_mode: "disabled"
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.0
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: "base_link"
    transform_tolerance: 1.0
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.12
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 1000

velocity_smoother:
  ros__parameters:
    enable: true
    input_topic: /cmd_vel
    output_topic: /cmd_vel_smoothed
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.65, 0.0, 1.2]
    min_velocity: [0.0, 0.0, -1.2]
    max_accel: [0.8, 0.0, 7.0]
    max_decel: [-0.1, 0.0, -7.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.05, 0.0, 0.05]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: False

collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel_smoothed"
    cmd_vel_out_topic: "/cmd_vel_safe"
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: false
    polygons: ["StopZone"]
    observation_sources: ["points"]
    StopZone:
      type: "polygon"
      action_type: "stop"
      slowdown_ratio: 0.0
      min_points: 8
      visualize: true
      enabled: true
      points: [2.5, 0.35, 2.5, -0.35, 1.6, -0.35, 1.6, 0.35]
    points:
      type: pointcloud
      topic: /points_raw
      min_height: 0.8
      max_height: 2.0
      enabled: true