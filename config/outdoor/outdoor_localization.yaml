/**:
  ros__parameters:
    #transform_tolerance: 10.0
    registration_method: NDT_OMP
    score_threshold: 8.0
    ndt_resolution: 2.0
    ndt_step_size: 0.1
    ndt_num_threads: 4 #8
    ndt_max_iterations: 35
    gicp_corr_randomness: 20
    gicp_max_correspondence_distance: 2.0
    vgicp_voxel_resolution: 1.0
    transform_epsilon: 0.01
    voxel_leaf_size: 0.2
    enable_scan_voxel_filter: true
    scan_max_range: 15.0
    scan_min_range: 1.0
    scan_period: 0.1
    cloud_queue_depth: 1
    min_scan_interval_sec: 0.15 #0.0
    use_pcd_map: true
    #map_path: "/data/trov_ws/map_straight.pcd"
    #map_path: "/data/trov_ws/outdoor_from_shutter_to_gate.pcd"
    map_path: "/data/trov_ws/map_indoor.pcd"
    #map_path: "/data/trov_ws/map.pcd"
    set_initial_pose: false
    initial_pose_x: 1.090 #0.0
    initial_pose_y: -0.379 #0.0
    initial_pose_z: 0.0
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_qw: 1.0
    use_odom: false
    use_twist_prediction: false
    twist_prediction_use_angular_velocity: false
    max_twist_prediction_dt: 0.5
    use_imu: false
    use_imu_preintegration: false
    use_twist_ekf: false
    use_gtsam_smoother: false
    enable_debug: false
    predict_pose_from_previous_delta: true
    enable_local_map_crop: true
    local_map_radius: 50.0
    local_map_min_points: 100
    reject_above_score_threshold: true
    enable_borderline_seed_rejection_gate: false
    enable_rejected_seed_update: false
    enable_recovery_retry_from_last_pose: true
    recovery_retry_from_last_pose_min_rejections: 3
    recovery_retry_from_last_pose_max_accepted_gap_sec: 1.0
    recovery_retry_from_last_pose_max_seed_translation_m: 15.0
    enable_reinitialization_request_output: true
    enable_reinitialization_request_latch: true
    reinitialization_trigger_threshold: 0.95
    reinitialization_trigger_gap_scale_sec: 30.0
    reinitialization_trigger_seed_translation_scale_m: 100.0
    reinitialization_trigger_reject_streak_scale: 200.0
    reinitialization_trigger_fitness_explosion_threshold: 1000.0
    enable_map_odom_tf: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    enable_timer_publishing: false #true
    pose_publish_frequency: 10.0
