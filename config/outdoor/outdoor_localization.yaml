/**:
  ros__parameters:
    #transform_tolerance: 10.0
    registration_method: NDT_OMP
    score_threshold: 8.0
    ndt_resolution: 2.0
    ndt_step_size: 0.1
    ndt_num_threads: 4 #8
    ndt_max_iterations: 35
    gicp_corr_randomness: 20
    gicp_max_correspondence_distance: 2.0
    vgicp_voxel_resolution: 1.0
    transform_epsilon: 0.01
    voxel_leaf_size: 0.2
    enable_scan_voxel_filter: true
    scan_max_range: 15.0
    scan_min_range: 1.0
    scan_period: 0.1
    cloud_queue_depth: 1
    min_scan_interval_sec: 0.15 #0.0
    use_pcd_map: true
    #map_path: "/data/trov_ws/map_straight.pcd"
    #map_path: "/data/trov_ws/outdoor_from_shutter_to_gate.pcd"
    map_path: "/data/trov_ws/src/trov/maps/outdoor/506_ver2.pcd"
    #map_path: "/data/trov_ws/map_left_right.pcd"
    #map_path: "/data/trov_ws/mrsam_outdoor.pcd"
    #map_path: "/home/nvidia/map.pcd"
    # Start pose on map 506_ver2 (measured 2026-11-11 14:38 by localization at the user's new start
    # spot, ~2.8 m ahead of the 13:00 spot; fitness 0.013, spread 2.5 cm / 0.25 deg, yaw 0.15 deg).
    # Only valid for 506_ver2. Starting elsewhere: use RViz "2D Pose Estimate" (/initialpose).
    # Previous 506_ver2 start (13:00): x -0.103, y 0.023, z 0.072, qz 0.004858, qw 0.999988
    # 506_ver1 start: x -0.601, y 0.359, z 0.169, qz 0.013404, qw 0.999910
    # (backups: /home/nvidia/trov_backups/localization_506_ver2_initpose_2026-11-11/)
    set_initial_pose: true
    initial_pose_x: 2.735
    initial_pose_y: -0.107
    initial_pose_z: 0.008
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.001303
    initial_pose_qw: 0.999999
    use_odom: false
    use_twist_prediction: true  # 2026-11-11: seed NDT with FAST-LIO velocity from lio_odom_bridge (/twist). Was false.
    twist_prediction_use_angular_velocity: true  # was false
    max_twist_prediction_dt: 1.0  # was 0.5; NDT runs ~2 Hz on the robot
    use_imu: false
    use_imu_preintegration: false
    use_twist_ekf: false
    use_gtsam_smoother: false
    enable_debug: false
    predict_pose_from_previous_delta: true
    enable_local_map_crop: true
    local_map_radius: 50.0
    local_map_min_points: 100
    reject_above_score_threshold: true
    enable_borderline_seed_rejection_gate: false
    enable_rejected_seed_update: false
    enable_recovery_retry_from_last_pose: true
    recovery_retry_from_last_pose_min_rejections: 3
    recovery_retry_from_last_pose_max_accepted_gap_sec: 1.0
    recovery_retry_from_last_pose_max_seed_translation_m: 15.0
    enable_reinitialization_request_output: true
    enable_reinitialization_request_latch: true
    reinitialization_trigger_threshold: 0.95
    reinitialization_trigger_gap_scale_sec: 30.0
    reinitialization_trigger_seed_translation_scale_m: 100.0
    reinitialization_trigger_reject_streak_scale: 200.0
    reinitialization_trigger_fitness_explosion_threshold: 1000.0
    enable_map_odom_tf: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    enable_timer_publishing: false #true
    pose_publish_frequency: 10.0
